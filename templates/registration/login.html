      <h1>AUXFRIME LTD COMPANY</h1>
      <p class="sub">Group lending &amp; loan — sign in to continue</p>
      <div class="form-card">
        {% if form.errors %}
          <p style="color: var(--rust); font-size: 13px; margin-top: 0;">Incorrect username or password. Please try again.</p>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="field">
            <label for="id_username">Username</label>
            {{ form.username }}
          </div>
          <div class="field password-field" style="position:relative;">
            <label for="id_password">Password</label>
            {{ form.password }}
            <button type="button" id="togglePassword" aria-label="Toggle password visibility" style="position:absolute; right:8px; top:34px; background:none; border:none; cursor:pointer; font-size:13px;">Show</button>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Sign in</button>
        </form>
      </div>
      <p class="muted" style="font-size: 11.5px; margin-top: 16px;">
        Rics Developers@2026   0715838585
      </p>

    <script>
      (function(){
        var img = document.getElementById('loginLogo');
        var fb = document.getElementById('logoFallback');
        function showFallback(){ if(img) img.style.display='none'; if(fb) fb.style.display='block'; }
        if (!img) { showFallback(); return; }
        if (img.complete) {
          if (img.naturalWidth === 0) showFallback();
        } else {
          img.addEventListener('error', showFallback);
          img.addEventListener('load', function(){ if(img.naturalWidth===0) showFallback(); });
        }
      })();
    </script>
    <script>
      (function(){
        var pwd = document.getElementById('id_password');
        var btn = document.getElementById('togglePassword');
        if (!pwd || !btn) return;
        btn.addEventListener('click', function(){
          if (pwd.type === 'password'){
            pwd.type = 'text';
            btn.textContent = 'Hide';
          } else {
            pwd.type = 'password';
            btn.textContent = 'Show';
          }
        });
      })();
    </script>
