{% extends 'base.html' %}
{% block content %}
<h1>{% if staff %}Assign task to {{ staff.user.get_full_name|default:staff.user.username }}{% else %}New Task{% endif %}</h1>
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  <div class="form-actions"><button class="btn btn-primary" type="submit">Save</button></div>
</form>
{% endblock %}
