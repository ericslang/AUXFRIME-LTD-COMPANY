{% extends 'base.html' %}
{% block title %}Add payment — Loan {{ loan.pk }}{% endblock %}
{% block content %}
  <button class="back-link" onclick="history.back()"><i class="ti ti-arrow-left"></i> Back</button>
  <div class="page-head">
    <div>
      <h2>Add payment</h2>
      <p>Record a payment for <strong>{{ loan.client.name }}</strong> (Loan #{{ loan.pk }}).</p>
    </div>
  </div>

  <div class="form-card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div style="margin-top:12px; display:flex; gap:8px;">
        <button type="submit" class="btn btn-primary">Record payment</button>
        <a href="{% url 'loan_detail' loan.pk %}" class="btn">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
